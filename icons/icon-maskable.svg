<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="trainBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="trainAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="headlightGlowMask" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled Group centered in safe zone (scale ~0.78, center 256, 256) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Railway Perspective Tracks at Bottom -->
    <g opacity="0.6">
      <polygon points="120,470 144,470 216,340 206,340" fill="url(#trackGrad)"/>
      <polygon points="392,470 368,470 296,340 306,340" fill="url(#trackGrad)"/>
      <rect x="156" y="450" width="200" height="10" rx="3" fill="#475569" opacity="0.8"/>
      <rect x="176" y="420" width="160" height="8" rx="3" fill="#475569" opacity="0.8"/>
      <rect x="194" y="392" width="124" height="7" rx="3" fill="#475569" opacity="0.8"/>
      <rect x="210" y="366" width="92" height="6" rx="3" fill="#475569" opacity="0.8"/>
      <rect x="222" y="344" width="68" height="5" rx="3" fill="#475569" opacity="0.8"/>
    </g>

    <ellipse cx="256" cy="385" rx="140" ry="24" fill="#020617" opacity="0.7" filter="url(#glowMask)"/>

    <path d="M 176,140 
             C 176,96, 336,96, 336,140
             L 356,220
             C 362,250, 362,310, 356,340
             L 344,360
             C 336,370, 310,374, 256,374
             C 202,374, 176,370, 168,360
             L 156,340
             C 150,310, 150,250, 156,220
             Z" 
          fill="url(#trainBody)" 
          stroke="#6366F1" 
          stroke-width="3"/>

    <path d="M 226,92 L 286,92 L 276,108 L 236,108 Z" fill="url(#trainAccent)"/>
    <circle cx="256" cy="80" r="6" fill="#38BDF8" filter="url(#glowMask)"/>
    <line x1="244" y1="88" x2="256" y2="80" stroke="#38BDF8" stroke-width="3"/>
    <line x1="268" y1="88" x2="256" y2="80" stroke="#38BDF8" stroke-width="3"/>

    <path d="M 188,144 
             C 188,124, 324,124, 324,144 
             L 336,196 
             C 336,204, 328,208, 256,208 
             C 184,208, 176,204, 176,196 
             Z" 
          fill="url(#glassGrad)" 
          stroke="#38BDF8" 
          stroke-width="2.5"/>

    <line x1="256" y1="130" x2="256" y2="208" stroke="#1E1B4B" stroke-width="4"/>
    <polygon points="194,148 230,146 220,198 184,198" fill="#FFFFFF" opacity="0.18"/>
    <polygon points="274,146 294,146 286,198 266,198" fill="#FFFFFF" opacity="0.12"/>

    <path d="M 154,236 C 200,244, 312,244, 358,236 L 358,248 C 312,256, 200,256, 154,248 Z" fill="url(#trainAccent)"/>

    <rect x="220" y="260" width="72" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="256" y="277" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="2">SBC</text>

    <g stroke="#312E81" stroke-width="2.5" stroke-linecap="round">
      <line x1="216" y1="298" x2="296" y2="298"/>
      <line x1="222" y1="306" x2="290" y2="306"/>
      <line x1="228" y1="314" x2="284" y2="314"/>
      <line x1="234" y1="322" x2="278" y2="322"/>
    </g>

    <g filter="url(#headlightGlowMask)">
      <circle cx="186" cy="276" r="14" fill="#FACC15"/>
      <circle cx="186" cy="276" r="8" fill="#FFFFFF"/>
    </g>
    <g filter="url(#headlightGlowMask)">
      <circle cx="326" cy="276" r="14" fill="#FACC15"/>
      <circle cx="326" cy="276" r="8" fill="#FFFFFF"/>
    </g>

    <circle cx="174" cy="334" r="5" fill="#EF4444" filter="url(#glowMask)"/>
    <circle cx="338" cy="334" r="5" fill="#EF4444" filter="url(#glowMask)"/>

    <path d="M 180,366 L 256,380 L 332,366 L 320,384 L 256,392 L 192,384 Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>

    <g transform="translate(370, 70)" filter="url(#glowMask)">
      <circle cx="28" cy="28" r="32" fill="#1E1B4B" stroke="#06B6D4" stroke-width="2.5"/>
      <ellipse cx="28" cy="18" rx="16" ry="6" fill="#06B6D4"/>
      <path d="M 12,18 L 12,25 C 12,28.5, 44,28.5, 44,25 L 44,18 Z" fill="#0284C7"/>
      <ellipse cx="28" cy="25" rx="16" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M 12,27 L 12,34 C 12,37.5, 44,37.5, 44,34 L 44,27 Z" fill="#0369A1"/>
      <ellipse cx="28" cy="34" rx="16" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
    </g>
  </g>
</svg>