<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgRadial" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="trainBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="cyanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="headlightBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgRadial)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Speed Light Rays / Aura Behind Locomotive -->
  <ellipse cx="256" cy="240" rx="170" ry="170" fill="#38BDF8" opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="256" cy="230" r="120" fill="#6366F1" opacity="0.12" filter="url(#softGlow)"/>

  <!-- High-Speed Converging Rails -->
  <polygon points="100,490 128,490 220,360 212,360" fill="url(#railGrad)"/>
  <polygon points="412,490 384,490 292,360 300,360" fill="url(#railGrad)"/>
  <!-- Sleepers -->
  <rect x="144" y="470" width="224" height="6" rx="3" fill="#38BDF8" opacity="0.3"/>
  <rect x="168" y="440" width="176" height="5" rx="2.5" fill="#38BDF8" opacity="0.25"/>
  <rect x="190" y="412" width="132" height="4" rx="2" fill="#38BDF8" opacity="0.2"/>
  <rect x="210" y="386" width="92" height="4" rx="2" fill="#38BDF8" opacity="0.15"/>

  <!-- Locomotive Shadow -->
  <ellipse cx="256" cy="405" rx="145" ry="22" fill="#020617" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Main Train Locomotive Outer Shell -->
  <path d="M 170,140
           C 170,82, 342,82, 342,140
           L 364,240
           C 370,280, 368,340, 356,370
           L 340,385
           C 328,396, 298,400, 256,400
           C 214,400, 184,396, 172,385
           L 156,370
           C 144,340, 142,280, 148,240
           Z"
        fill="url(#trainBodyGrad)"
        stroke="#818CF8"
        stroke-width="3"
        stroke-opacity="0.8"/>

  <!-- Roof Aerodynamic Cap -->
  <path d="M 216,84 C 236,76, 276,76, 296,84 L 284,102 L 228,102 Z" fill="url(#cyanSweep)"/>
  <circle cx="256" cy="72" r="7" fill="#38BDF8" filter="url(#softGlow)"/>
  <line x1="242" y1="80" x2="256" y2="72" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="270" y1="80" x2="256" y2="72" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Aerodynamic Curved Panoramic Windshield -->
  <path d="M 184,142
           C 184,116, 328,116, 328,142
           L 344,204
           C 344,216, 332,222, 256,222
           C 180,222, 168,216, 168,204
           Z"
        fill="url(#windshieldGrad)"
        stroke="#38BDF8"
        stroke-width="2.5"/>

  <!-- Windshield Reflection Glare -->
  <polygon points="192,142 228,140 214,214 178,214" fill="#FFFFFF" opacity="0.22"/>
  <polygon points="274,138 296,138 288,214 266,214" fill="#FFFFFF" opacity="0.12"/>
  <line x1="256" y1="126" x2="256" y2="222" stroke="#0F172A" stroke-width="3.5"/>

  <!-- Dynamic Sweeping Chevron Accent -->
  <path d="M 148,246 C 200,258, 312,258, 364,246 L 362,260 C 312,272, 200,272, 150,260 Z" fill="url(#cyanSweep)"/>

  <!-- Center Identity Plaque: SBC COACH DB -->
  <rect x="214" y="272" width="84" height="26" rx="7" fill="#0A0F1D" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="256" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2.5">SBC</text>

  <!-- Front Grille Precision Slits -->
  <g stroke="#4338CA" stroke-width="2.5" stroke-linecap="round">
    <line x1="214" y1="312" x2="298" y2="312"/>
    <line x1="220" y1="322" x2="292" y2="322"/>
    <line x1="228" y1="332" x2="284" y2="332"/>
  </g>

  <!-- Radiant Twin LED Projector Headlights -->
  <polygon points="186,288 116,450 196,450" fill="#FDE047" opacity="0.12"/>
  <g filter="url(#headlightBloom)">
    <circle cx="186" cy="288" r="16" fill="#FACC15"/>
    <circle cx="186" cy="288" r="9" fill="#FFFFFF"/>
  </g>

  <polygon points="326,288 316,450 396,450" fill="#FDE047" opacity="0.12"/>
  <g filter="url(#headlightBloom)">
    <circle cx="326" cy="288" r="16" fill="#FACC15"/>
    <circle cx="326" cy="288" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Twin Red Tail / Emergency Marker LEDs -->
  <circle cx="170" cy="354" r="6.5" fill="#EF4444" filter="url(#softGlow)"/>
  <circle cx="170" cy="354" r="3" fill="#FCA5A5"/>

  <circle cx="342" cy="354" r="6.5" fill="#EF4444" filter="url(#softGlow)"/>
  <circle cx="342" cy="354" r="3" fill="#FCA5A5"/>

  <!-- Aerodynamic Base Buffer / Cowcatcher -->
  <path d="M 174,386 L 256,404 L 338,386 L 324,408 L 256,416 L 188,408 Z" fill="#0F172A" stroke="#475569" stroke-width="2.5"/>

  <!-- Modern Database Cylinder Badge -->
  <g transform="translate(376, 52)" filter="url(#softGlow)">
    <circle cx="32" cy="32" r="34" fill="#0B132B" stroke="#38BDF8" stroke-width="2.5"/>
    <ellipse cx="32" cy="20" rx="17" ry="6" fill="#38BDF8"/>
    <path d="M 15,20 L 15,28 C 15,32, 49,32, 49,28 L 49,20 Z" fill="#0284C7"/>
    <ellipse cx="32" cy="28" rx="17" ry="6" fill="none" stroke="#67E8F9" stroke-width="1.2"/>
    <path d="M 15,29 L 15,37 C 15,41, 49,41, 49,37 L 49,29 Z" fill="#0369A1"/>
    <ellipse cx="32" cy="37" rx="17" ry="6" fill="none" stroke="#67E8F9" stroke-width="1.2"/>
    <path d="M 15,38 L 15,46 C 15,50, 49,50, 49,46 L 49,38 Z" fill="#075985"/>
    <ellipse cx="32" cy="46" rx="17" ry="6" fill="none" stroke="#67E8F9" stroke-width="1.2"/>
  </g>
</svg>